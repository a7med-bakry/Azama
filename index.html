<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#08090c">

  <title>عظمة</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="app-shell">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="brand">

        <div class="brand-mark">
          ع
        </div>

        <div class="brand-text">

          <div class="brand-name">
            عَظَمَة
          </div>

          <div class="brand-sub">
            CLIP AGENCY
          </div>

        </div>

      </div>

      <nav class="desktop-nav">

        <button
          class="nav-item active"
          data-view="dashboard"
        >
          <span class="nav-icon">⌂</span>
          <span>الرئيسية</span>
        </button>

        <button
          class="nav-item"
          data-view="accounts"
        >
          <span class="nav-icon">◉</span>
          <span>الحسابات</span>
        </button>

        <button
          class="nav-item"
          data-view="channels"
        >
          <span class="nav-icon">▶</span>
          <span>القنوات</span>
        </button>

      </nav>

      <div class="sidebar-bottom">

        <div class="offline-status">
          <span></span>
          Offline
        </div>

        <div class="sidebar-copy">
          عظمة • V1
        </div>

      </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

      <!-- TOP BAR -->
      <header class="topbar">

        <div class="topbar-title">

          <div class="eyebrow">
            CLIP AGENCY
          </div>

          <h1 id="pageTitle">
            لوحة التحكم
          </h1>

        </div>

        <button
          class="quick-add"
          id="quickAdd"
        >
          <span>+</span>
          <span>حساب جديد</span>
        </button>

      </header>


      <!-- DASHBOARD -->
      <section
        id="dashboardView"
        class="view active"
      ></section>


      <!-- ACCOUNTS -->
      <section
        id="accountsView"
        class="view"
      ></section>


      <!-- CHANNELS -->
      <section
        id="channelsView"
        class="view"
      ></section>

    </main>


    <!-- MOBILE NAV -->
    <nav class="mobile-nav">

      <button
        class="mobile-nav-item active"
        data-view="dashboard"
      >
        <span>⌂</span>
        <small>الرئيسية</small>
      </button>

      <button
        class="mobile-nav-item"
        data-view="accounts"
      >
        <span>◉</span>
        <small>الحسابات</small>
      </button>

      <button
        class="mobile-add"
        id="mobileAdd"
      >
        +
      </button>

      <button
        class="mobile-nav-item"
        data-view="channels"
      >
        <span>▶</span>
        <small>القنوات</small>
      </button>

      <button
        class="mobile-nav-item"
        id="mobileMore"
      >
        <span>•••</span>
        <small>المزيد</small>
      </button>

    </nav>

  </div>


  <!-- MODAL -->
  <div
    class="modal-backdrop"
    id="modalBackdrop"
  >

    <div
      class="modal"
      id="modal"
    ></div>

  </div>


  <!-- TOAST -->
  <div
    class="toast"
    id="toast"
  ></div>


  <script src="app.js"></script>

  <script>

    /*
      Mobile navigation
    */

    document
      .querySelectorAll(".mobile-nav-item")
      .forEach(button => {

        button.addEventListener("click", () => {

          const view = button.dataset.view;

          if (!view) return;

          document
            .querySelectorAll(".mobile-nav-item")
            .forEach(item => {
              item.classList.remove("active");
            });

          button.classList.add("active");

          state.view = view;
          state.accountId = null;
          state.channelId = null;

          render();

        });

      });


    /*
      Mobile add button
    */

    const mobileAdd =
      document.getElementById("mobileAdd");

    if (mobileAdd) {

      mobileAdd.addEventListener(
        "click",
        () => {

          openAccountModal();

        }
      );

    }


    /*
      Sync desktop navigation
      with mobile navigation
    */

    const originalRender = window.render;

    window.render = function () {

      originalRender();

      document
        .querySelectorAll(".mobile-nav-item")
        .forEach(item => {

          item.classList.toggle(
            "active",
            item.dataset.view === state.view
          );

        });

    };

  </script>

</body>
</html>
